version: '3.8'

services:
  app:
    build: ./backend
    container_name: laravel_app
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=ganado
      - DB_USERNAME=admin
      - DB_PASSWORD=secret

  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: ganado
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "55432:5432"

  frontend:
    build: ./frontend
    container_name: vue_app
    volumes:
      - ./frontend:/app
      - /app/node_modules # Protege las dependencias dentro del contenedor
    ports:
      - "5173:5173"
    command: npm run dev
    working_dir: /app

volumes:
  pgdata:
